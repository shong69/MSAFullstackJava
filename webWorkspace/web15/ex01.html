<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style rel="stylesheet" type="text/css">
        #carousel{
            width: 300px;
            height: 300px;
            overflow: hidden; 
        }
        #carousel>ul{
            list-style: none;
            padding: 0px;
            margin: 0px auto;
        }
        #carousel>ul>li{
            float : left;
        }
        #carousel>ul>li>img{
            width: 300px;
            height: 300px;
        }

    </style>
    <script type="text/javascript" src="js/jquery-1.12.4.min.js"></script>
    <script type="text/javascript">
        $(function(){ //window.onlooad
            $('body>div').width(800).css('margin','0px auto');
            $('#header').html('<img src="http://www.kibwa.org/data/skin/default/images/da_image/hd_logo.png">');
            $('#menu').find('ul').width(400).css('margin','0px auto').css('list-style','none').css('padding',0)
                        .find('li').width(100).css('float','left')
                            .find('a').css({'display':'block','background-color':'gray','color':'rgb(255, 255, 255)'})
                            .end()
                        .end()
                    // .end().height(50).css('background-color','rgb(200,200,200)');
                    .end().next().css('clear','left'); //다음 요소의 clear을 하기 위해서
            init3();
            setInterval(func03,1000); //캐러셀 변환이이 3초마다 작동하도록
        });
        //캐러셀 함수 예시 func01, func02, func03
        var su = 1;
        function func01(){
            if(su>6) su = 1;
            $('#carousel').html('<img src="imgs/b'+su+'.avif" />');
            su++;
        }
        //------------------
        function func02(){
            if(su>6) su = 1;
            var img = $('<img/>').attr('src',"imgs/b"+su+".avif");
            $('#carousel').empty().append(img); //empty 하지 않으면 이미지가 계속 쌓이게 됨
            su++;
        }
        //-------------------
        var arr= [];
        function init(){
            arr.push('imgs/b1.avif');
            arr.push('imgs/b2.avif');
            arr.push('imgs/b3.avif');
            arr.push('imgs/b4.avif');
            arr.push('imgs/b5.avif');
            arr.push('imgs/b6.avif');
            $('#carousel').html('<img />');
        }
        function init2(){
            arr.push('imgs/b1.avif');
            arr.push('imgs/b2.avif');
            arr.push('imgs/b3.avif');
            arr.push('imgs/b4.avif');
            arr.push('imgs/b5.avif');
            arr.push('imgs/b6.avif');
            $('#carousel').html('<ul/>');
            $(arr).map(function(idx,ele){
                $('<li>').append($('<img/>').attr('src',ele))
                    .appendTo('#carousel>ul');
            });
        }
        function init3(){
            arr.push('imgs/b1.avif');
            arr.push('imgs/b2.avif');
            arr.push('imgs/b3.avif');
            arr.push('imgs/b4.avif');
            arr.push('imgs/b5.avif');
            arr.push('imgs/b6.avif');
            $('#carousel').html('<ul/>');
            $(arr).map(function(idx,ele){
                $('<img/>').attr('src',ele).wrap('<li></li>') //li로 각각의 img마다 감싸줌
                    .appendTo('#carousel>ul');
            });
        }
        function func03(){
            $('#carousel>img').attr('src',arr[0]);
            arr.push(arr.shift());
        }
        //--------
        function func04(){
            //첫번째 li를 빼서 제일 뒤에 넣어줌 -> 그림 순서가 바뀌는 모습이 된다
            $('#carousel>ul>li').first().appendTo('#carousel>ul'); 
        }

    </script>
</head>
<body>
    <div>
        <div id="header">
            <h1>logo</h1>
        </div>
        <div id="menu">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">MAIN</a></li>
                <li><a href="#">BBS</a></li>
                <li><a href="#">LOGIN</a></li>
            </ul>
        </div>
        <div id="content">
            <div id="carousel"></div>
        </div>
        <div id="footer">
            <address></address>
        </div>
    </div>
</body>
</html>
