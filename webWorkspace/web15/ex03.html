<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="js/jquery-1.12.4.min.js"></script>
    <script type="text/javascript">
        $(function(){
            $('input')
                .keydown(function(e){
                    console.log('keydown',e.key,e.keyCode, $('input').val());
                })
                .keypress(function(e){
                    console.log('keypress',e.key,e.keyCode, $('input').val());
                })
                .keyup(function(e){
                    console.log('keyup',e.key,e.keyCode, $('input').val())
                    $('#target').html($('input').val()); //입력할 때마다 target에 값이 추가되도록
                });
            $('button').click(function(){ //버튼 클릭 시 입력 값이 target에 추가되도록
                $('#target').html($('#target').html()+ '<br/>'+$('input').val());
        });
        });

    </script>
</head>
<body>
    <h1>key event</h1>
    <input/><button>입력</button>
    <div id="target"></div>
</body>
</html>
